<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>GUMAC CRM Dashboard — Tổng quan kinh doanh tháng 5/2026</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<script src="https://unpkg.com/recharts@2.12.7/umd/Recharts.js"></script>
<style>
  :root {
    --bg-base: #f7f8fb;
    --surface: #ffffff;
    --border-soft: rgba(15, 23, 42, 0.06);
    --text-primary: #0f172a;
    --text-secondary: #475569;
    --text-tertiary: #94a3b8;
    --pastel-blue: #c7dafc;
    --pastel-blue-strong: #93b6f5;
    --pastel-blue-deep: #5b8def;
    --pastel-purple: #d9c8f7;
    --pastel-purple-strong: #b89cf0;
    --pastel-pink: #f7c8dc;
    --pastel-pink-strong: #ed9ebe;
    --pastel-green: #b9e6c9;
    --pastel-green-strong: #6dc88a;
    --pastel-amber: #f8dcae;
    --pastel-amber-strong: #d4a849;
    --pastel-red: #f5b9b9;
    --pastel-red-strong: #e57878;
  }
  * { -webkit-font-smoothing: antialiased; -moz-osx-font-smoothing: grayscale; }
  body {
    font-family: 'Inter', -apple-system, sans-serif;
    margin: 0;
    color: var(--text-primary);
    background: var(--bg-base);
    background-image:
      radial-gradient(at 8% 0%, rgba(199, 218, 252, 0.45) 0px, transparent 50%),
      radial-gradient(at 92% 6%, rgba(247, 200, 220, 0.35) 0px, transparent 50%),
      radial-gradient(at 50% 100%, rgba(217, 200, 247, 0.30) 0px, transparent 50%);
    background-attachment: fixed;
    min-height: 100vh;
  }
  .display-font { font-family: 'Plus Jakarta Sans', sans-serif; letter-spacing: -0.022em; }
  .ticker { font-variant-numeric: tabular-nums; font-feature-settings: 'tnum'; }
  .surface {
    background: var(--surface);
    border-radius: 24px;
    border: 1px solid var(--border-soft);
    box-shadow: 0 1px 2px rgba(15,23,42,0.03), 0 8px 24px -12px rgba(15,23,42,0.06);
  }
  .surface-elevated {
    background: var(--surface);
    border-radius: 28px;
    border: 1px solid var(--border-soft);
    box-shadow: 0 1px 2px rgba(15,23,42,0.03), 0 12px 40px -16px rgba(15,23,42,0.10), 0 2px 8px -2px rgba(15,23,42,0.04);
  }
  .glass {
    background: rgba(255, 255, 255, 0.65);
    backdrop-filter: blur(20px) saturate(160%);
    -webkit-backdrop-filter: blur(20px) saturate(160%);
    border: 1px solid rgba(255, 255, 255, 0.4);
  }
  .pill { border-radius: 9999px; padding: 6px 12px; font-size: 11px; font-weight: 600; letter-spacing: 0.02em; }
  @keyframes fadeUp { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
  .fadeup { animation: fadeUp 0.5s cubic-bezier(0.16, 1, 0.3, 1) backwards; }
  @keyframes shimmer { 0% { background-position: -200% 0; } 100% { background-position: 200% 0; } }
  .shimmer-text {
    background: linear-gradient(90deg, #5b8def, #b89cf0, #ed9ebe, #b89cf0, #5b8def);
    background-size: 200% auto;
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    animation: shimmer 6s linear infinite;
  }
  ::-webkit-scrollbar { width: 8px; height: 8px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: rgba(15,23,42,0.1); border-radius: 4px; }
  ::-webkit-scrollbar-thumb:hover { background: rgba(15,23,42,0.2); }
  .recharts-cartesian-grid-horizontal line, .recharts-cartesian-grid-vertical line { stroke: rgba(15,23,42,0.05); }
  .recharts-tooltip-wrapper { outline: none !important; }

  /* CRM specific */
  .nav-pill {
    padding: 10px 18px;
    border-radius: 14px;
    font-size: 13px;
    font-weight: 600;
    color: var(--text-secondary);
    background: transparent;
    border: 1px solid transparent;
    transition: all 0.2s ease;
    cursor: pointer;
    white-space: nowrap;
  }
  .nav-pill:hover { background: rgba(15,23,42,0.04); color: var(--text-primary); }
  .nav-pill.active {
    background: white;
    color: var(--text-primary);
    border: 1px solid var(--border-soft);
    box-shadow: 0 2px 8px rgba(15,23,42,0.06);
  }
  .stat-card {
    padding: 20px 22px;
    border-radius: 22px;
    background: white;
    border: 1px solid var(--border-soft);
    position: relative;
    overflow: hidden;
    transition: transform 0.2s ease, box-shadow 0.2s ease;
  }
  .stat-card:hover { transform: translateY(-2px); box-shadow: 0 12px 32px -16px rgba(15,23,42,0.12); }
  .stat-card-accent { position: absolute; top: 0; left: 0; right: 0; height: 3px; }
  .progress-track {
    height: 8px;
    background: rgba(15,23,42,0.05);
    border-radius: 99px;
    overflow: hidden;
    position: relative;
  }
  .progress-fill {
    height: 100%;
    border-radius: 99px;
    transition: width 0.6s cubic-bezier(0.16, 1, 0.3, 1);
  }
  .badge-success { background: #e8f5ee; color: #2d6a47; border: 1px solid #b9e6c9; }
  .badge-warn { background: #fdf6e3; color: #8a6611; border: 1px solid #f8dcae; }
  .badge-danger { background: #fdecec; color: #9a3232; border: 1px solid #f5b9b9; }
  .badge-info { background: #eef4fe; color: #2c5cb8; border: 1px solid #c7dafc; }
  .badge-purple { background: #f3edfb; color: #6b4ea5; border: 1px solid #d9c8f7; }
  .row-hover:hover { background: rgba(199, 218, 252, 0.18); }
  .rank-medal {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 30px; height: 30px;
    border-radius: 9px;
    font-weight: 700;
    font-size: 13px;
    font-family: 'Plus Jakarta Sans', sans-serif;
  }
  .rank-1 { background: linear-gradient(135deg, #fde68a, #f59e0b); color: #783c0a; }
  .rank-2 { background: linear-gradient(135deg, #e2e8f0, #94a3b8); color: #1e293b; }
  .rank-3 { background: linear-gradient(135deg, #fed7aa, #c2410c); color: #6b1d04; }
  .rank-other { background: rgba(15,23,42,0.05); color: var(--text-secondary); }

  .section-divider {
    display: flex; align-items: center; gap: 14px;
    margin: 36px 0 18px 0;
  }
  .section-divider-line { flex:1; height: 1px; background: linear-gradient(90deg, rgba(15,23,42,0.08), transparent); }
  .section-num {
    width: 32px; height: 32px;
    border-radius: 10px;
    background: linear-gradient(135deg, #5b8def, #b89cf0);
    color: white;
    display: inline-flex; align-items: center; justify-content: center;
    font-family: 'Plus Jakarta Sans', sans-serif;
    font-weight: 700;
    font-size: 14px;
    box-shadow: 0 4px 12px rgba(91,141,239,0.3);
  }

  .insight-card {
    padding: 18px 20px;
    border-radius: 18px;
    background: white;
    border: 1px solid var(--border-soft);
    border-left-width: 4px;
  }
  .insight-success { border-left-color: var(--pastel-green-strong); }
  .insight-warn { border-left-color: var(--pastel-amber-strong); }
  .insight-danger { border-left-color: var(--pastel-red-strong); }
  .insight-info { border-left-color: var(--pastel-blue-deep); }

  .filter-btn {
    padding: 7px 14px;
    border-radius: 11px;
    font-size: 12px;
    font-weight: 500;
    color: var(--text-secondary);
    background: white;
    border: 1px solid var(--border-soft);
    cursor: pointer;
    transition: all 0.15s ease;
  }
  .filter-btn:hover { border-color: rgba(15,23,42,0.15); }
  .filter-btn.active {
    background: var(--text-primary);
    color: white;
    border-color: var(--text-primary);
  }

  .mini-bar {
    display:inline-block;
    height:6px;
    background: rgba(15,23,42,0.06);
    border-radius: 4px;
    width: 80px;
    position: relative;
    vertical-align: middle;
  }
  .mini-bar-fill {
    position:absolute; left:0; top:0; bottom:0;
    border-radius: 4px;
  }
</style>
</head>
<body>
<div id="root"><div style="text-align:center;padding:80px;color:#64748b;font-family:sans-serif;">Đang tải dashboard...</div></div>

<script type="text/babel" data-presets="react">
const { useState, useMemo, useEffect } = React;
const { LineChart, Line, XAxis, YAxis, CartesianGrid, Tooltip, Legend, ResponsiveContainer, Area, AreaChart, ComposedChart, BarChart, Bar, ReferenceLine, Cell, PieChart, Pie } = Recharts;
